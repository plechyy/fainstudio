<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
<filter id="cl" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency=".010" numOctaves="3" seed="6" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="70" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="9"/></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
<radialGradient id="vol" cx="34%" cy="28%" r="80%"><stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset=".75" stop-color="#2a0e02" stop-opacity=".25"/><stop offset="1" stop-color="#1a0800" stop-opacity=".6"/></radialGradient>
<mask id="pm"><circle cx="256" cy="256" r="150" fill="#fff" filter="url(#soft)"/></mask>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a5230"/><stop offset=".3" stop-color="#f6dcc0"/><stop offset=".55" stop-color="#d79a63"/><stop offset=".8" stop-color="#fbe8d2"/><stop offset="1" stop-color="#8a5230"/></linearGradient>
<linearGradient id="ringB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5c3319"/><stop offset=".5" stop-color="#9b6238"/><stop offset="1" stop-color="#5c3319"/></linearGradient>
<clipPath id="top"><rect x="-100" y="-100" width="700" height="356.5" transform="rotate(-22 256 256)"/></clipPath>
<clipPath id="bot"><rect x="-100" y="256.5" width="700" height="356" transform="rotate(-22 256 256)"/></clipPath>
</defs>
<g clip-path="url(#top)"><ellipse cx="256" cy="256" rx="214" ry="64" fill="none" stroke="url(#ringB)" stroke-width="20" transform="rotate(-22 256 256)"/></g>
<g mask="url(#pm)">
 <g filter="url(#cl)">
  <circle cx="256" cy="256" r="150" fill="#b8541a"/>
  <ellipse cx="205" cy="215" rx="95" ry="85" fill="#e2762c"/>
  <ellipse cx="320" cy="310" rx="95" ry="75" fill="#8a3f12"/>
  <ellipse cx="240" cy="235" rx="70" ry="62" fill="#ff9a55"/>
 </g>
 <circle cx="256" cy="256" r="150" fill="url(#vol)"/>
</g>
<g clip-path="url(#bot)">
 <ellipse cx="256" cy="256" rx="214" ry="64" fill="none" stroke="url(#ring)" stroke-width="20" transform="rotate(-22 256 256)"/>
 <ellipse cx="256" cy="256" rx="214" ry="64" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3" transform="rotate(-22 256 256) translate(0,-6)"/>
</g>
