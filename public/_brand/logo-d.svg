<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <filter id="cloud-d" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="3" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="90" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation="16"/>
  </filter>
  <filter id="core-d" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="6" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="60" xChannelSelector="G" yChannelSelector="R" result="d"/>
    <feGaussianBlur in="d" stdDeviation="22"/>
  </filter>
</defs>
<g filter="url(#cloud-d)">
  <ellipse cx="256" cy="262" rx="190" ry="170" fill="#c2601e"/>
  <ellipse cx="190" cy="215" rx="110" ry="100" fill="#d96f26"/>
  <ellipse cx="330" cy="320" rx="120" ry="95" fill="#b8541a"/>
</g>
<g filter="url(#core-d)">
  <ellipse cx="270" cy="250" rx="105" ry="95" fill="#ff9a55" opacity=".85"/>
</g>
